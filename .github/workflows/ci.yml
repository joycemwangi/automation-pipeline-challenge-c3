name: CI / build

on:
  push:
    branches: ["**"]        # build when you push to any branch
  pull_request:
    branches: ["**"]        # keep PR status visible (job below is a no-op)

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/automation-pipeline-challenge-c3-api
  DOCKER_BUILDKIT: "1"

jobs:
  # Fast, always-green job so PRs show a status and never hang
  pr-status:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo "PR OK – build runs on pushes only."

  # Real Docker build & push (runs only on push events)
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: ./demo-api
          file: ./demo-api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:${{ github.ref_name == 'main' && 'main' || github.ref_name }}
