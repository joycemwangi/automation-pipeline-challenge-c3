name: CI / build

on:
  push:
    branches: ["**"]        # keep your 'any branch' behavior
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  packages: write           # needed when we push to GHCR

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/automation-pipeline-challenge-c3-api
  DOCKER_BUILDKIT: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Detect if we actually have an app to build
      - name: Detect build context
        id: detect
        shell: bash
        run: |
          APP_DIR="demo-api"
          if [[ -f "$APP_DIR/package.json" ]]; then
            echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
            echo "need_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_dir=" >> "$GITHUB_OUTPUT"
            echo "need_build=false" >> "$GITHUB_OUTPUT"
          fi

      # Fast-pass success for docs/README/PDF-only changes
      - name: No build needed
        if: steps.detect.outputs.need_build == 'false'
        run: echo "No buildable app detected (no package.json). Passing CI ✅"

      - name: Set up Docker Buildx
        if: steps.detect.outputs.need_build == 'true'
        uses: docker/setup-buildx-action@v3

      # Only log in to GHCR when we will actually push (push to main)
      - name: Log in to GHCR (push only)
        if: steps.detect.outputs.need_build == 'true' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR) or Build+Push (push)
        if: steps.detect.outputs.need_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.detect.outputs.app_dir }}
          file: ${{ steps.detect.outputs.app_dir }}/Dockerfile
          # Push images on push events; PRs will only build/test
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:${{ github.ref_name == 'main' && 'main' || github.ref_name }}
