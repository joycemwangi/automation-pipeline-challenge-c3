name: CI

on:
  push:
    branches: ["**"]        # runs on every push (e.g., main)
  pull_request:             # also run on PRs so you get: CI / build (pull_request)

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # needed only for GHCR push on 'push' events

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login only on push events (so PRs build but do NOT push)
      - name: Log in to GHCR (push only)
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # For PRs: build only. For pushes: build+push.
      - name: Build (PR) or Build+Push (push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: demo-api/Dockerfile      # adjust if your Dockerfile lives elsewhere
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/automation-pipeline-challenge-c3-api:${{ github.sha }}
