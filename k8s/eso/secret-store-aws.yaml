apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-sm
  namespace: demo
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        jwt:                          # for EKS IRSA or webhook auth
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
