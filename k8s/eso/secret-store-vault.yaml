apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-kv
  namespace: demo
spec:
  provider:
    vault:
      server: https://vault.example.com            # <- your Vault URL
      path: kv                                     # <- KV mount path
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes                    # <- Vault auth mount name
          role: external-secrets                   # <- Vault role mapped to SA below
          serviceAccountRef:
            name: external-secrets                 # ESO controller ServiceAccount
            namespace: external-secrets            # ESO namespace
      # If Vault uses a custom CA, uncomment and paste base64 PEM:
      # caBundle: <BASE64_PEM_CA>
